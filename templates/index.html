<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#212121;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
}

.chat-container{
    width:100%;
    max-width:900px;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    border-bottom:1px solid #333;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:20px;
    max-width:80%;
    padding:15px;
    border-radius:12px;
    line-height:1.7;
    word-wrap:break-word;
    white-space:pre-wrap;
}

.user{
    background:#2f2f2f;
    margin-left:auto;
}

.ai{
    background:#343541;
    margin-right:auto;
}

.input-area{
    padding:20px;
    border-top:1px solid #333;
}

form{
    display:flex;
    gap:10px;
}

select{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2f2f2f;
    color:white;
    cursor:pointer;
    min-width:180px;
}

select:focus{
    outline:none;
}

input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2f2f2f;
    color:white;
    font-size:16px;
}

input:focus{
    outline:none;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    background:#10a37f;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0d8f6f;
}

.placeholder{
    text-align:center;
    color:#aaa;
    margin-top:120px;
}

.model-name{
    color:#10a37f;
    font-weight:bold;
    margin-bottom:10px;
}

@media (max-width:700px){
    form{
        flex-direction:column;
    }

    .message{
        max-width:100%;
    }
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        AI Multi Model Chatbot
    </div>

    <div class="chat-box" id="chat-box">

        {% if messages %}

            {% for message in messages %}

                <div class="message {{ message.role }}">

                    {% if message.role == "ai" %}
                        <div class="model-name">
                            {{ message.model }}
                        </div>
                    {% endif %}

                    {{ message.content }}

                </div>

            {% endfor %}

        {% else %}

        <div class="placeholder">
            <h2>Welcome</h2>
            <br>
            Choose a model and start chatting.
        </div>

        {% endif %}

    </div>

    <div class="input-area">

        <form method="POST">

            <select name="model">

                <option value="gemini" {% if selected_model == "gemini" %}selected{% endif %}>
                    {{ model_labels["gemini"] }}
                </option>

                <option value="deepseek/deepseek-chat" {% if selected_model == "deepseek/deepseek-chat" %}selected{% endif %}>
                    {{ model_labels["deepseek/deepseek-chat"] }}
                </option>

                <option value="meta-llama/llama-3.3-70b-instruct" {% if selected_model == "meta-llama/llama-3.3-70b-instruct" %}selected{% endif %}>
                    {{ model_labels["meta-llama/llama-3.3-70b-instruct"] }}
                </option>

                <option value="qwen/qwen3-32b" {% if selected_model == "qwen/qwen3-32b" %}selected{% endif %}>
                    {{ model_labels["qwen/qwen3-32b"] }}
                </option>

            </select>

            <input
                type="text"
                name="question"
                placeholder="Message AI Assistant..."
                autocomplete="off"
                required>

            <button type="submit">
                Send
            </button>

        </form>

    </div>

</div>

<script>
const chatBox = document.getElementById("chat-box");
chatBox.scrollTop = chatBox.scrollHeight;
</script>

</body>
</html>
