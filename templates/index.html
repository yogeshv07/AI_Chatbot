<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#212121;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
}

.chat-container{
    width:100%;
    max-width:900px;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    border-bottom:1px solid #333;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:20px;
    max-width:80%;
    padding:15px;
    border-radius:12px;
    line-height:1.7;
    word-wrap:break-word;
}

.user{
    background:#2f2f2f;
    margin-left:auto;
}

.ai{
    background:#343541;
    margin-right:auto;
}

.input-area{
    padding:20px;
    border-top:1px solid #333;
}

form{
    display:flex;
    gap:10px;
}

select{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2f2f2f;
    color:white;
    cursor:pointer;
    min-width:180px;
}

select:focus{
    outline:none;
}

input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2f2f2f;
    color:white;
    font-size:16px;
}

input:focus{
    outline:none;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    background:#10a37f;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0d8f6f;
}

.placeholder{
    text-align:center;
    color:#aaa;
    margin-top:120px;
}

.model-name{
    color:#10a37f;
    font-weight:bold;
    margin-bottom:10px;
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        🤖 AI Multi Model Chatbot
    </div>

    <div class="chat-box">

        {% if question %}

        <div class="message user">
            {{ question }}
        </div>

        <div class="message ai">

            <div class="model-name">
                {{ selected_model }}
            </div>

            {{ answer }}

        </div>

        {% else %}

        <div class="placeholder">
            <h2>Welcome</h2>
            <br>
            Choose a model and start chatting.
        </div>

        {% endif %}

    </div>

    <div class="input-area">

        <form method="POST">

            <select name="model">

                <option value="gemini">
                    Gemini 2.5 Flash
                </option>

                <option value="deepseek/deepseek-chat">
                    DeepSeek Chat
                </option>

                <option value="meta-llama/llama-3.3-70b-instruct">
                    Llama 3.3
                </option>

                <option value="qwen/qwen3-32b">
                    Qwen 3
                </option>

            </select>

            <input
                type="text"
                name="question"
                placeholder="Message AI Assistant..."
                required>

            <button type="submit">
                Send
            </button>

        </form>

    </div>

</div>

</body>
</html>
